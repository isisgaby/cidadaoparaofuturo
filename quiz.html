<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>

  <style>
    body{
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 50px;
    }

    .quiz-box{
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      margin: auto;
    }

    button{
      padding: 10px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #a855f7;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="quiz-box">

  <h1>🎯 Quiz de Tecnologia</h1>

  <p>
    A internet faz parte das TIC?
  </p>

  <button onclick="respostaCerta()">
    Sim
  </button>

  <button onclick="respostaErrada()">
    Não
  </button>

</div>

<script>

function respostaCerta(){
  alert("✅ Resposta correta!");
}

function respostaErrada(){
  alert("❌ Resposta errada!");
}

</script>

</body>
</html>
